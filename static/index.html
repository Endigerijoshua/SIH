<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SIH26162 — Industrial Fire Detection Console</title>
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  >
  <style>
    :root {
      /* Command-console palette (tune here) */
      --bg-0: #070b12;
      --bg-1: #0c1320;
      --bg-2: #121b2c;
      --bg-3: #182338;
      --line: #22304a;
      --line-soft: #1a2540;
      --text-1: #dbe4f0;
      --text-2: #8494ab;
      --text-3: #5b6a82;

      --accent: #22d3ee;      /* electric cyan — UI chrome / active */
      --accent-dim: #0e7490;

      --ember: #e5484d;        /* deep ember red */
      --ember-deep: #8f1f1a;
      --amber: #f59e0b;        /* bright amber */
      --amber-pale: #fde68a;   /* pale yellow */

      --flare: #f97316;        /* gas flare */
      --mine: #a16207;         /* mining bronze */
      --forest: #34d399;
      --industrial: #60a5fa;
      --persist: #fbbf24;      /* persistent amber */
      --site: #c084fc;
      --power: #818cf8;

      --font-display: "Chakra Petch", "Segoe UI", sans-serif;
      --font-body: "Inter", "Segoe UI", sans-serif;
      --font-mono: "IBM Plex Mono", "Consolas", monospace;
    }

    html, body {
      margin: 0; padding: 0; height: 100%;
      font-family: var(--font-body);
      background: var(--bg-0); color: var(--text-1);
      overflow: hidden;
    }

    /* Faint scanline texture over the whole console */
    .scanlines {
      position: fixed; inset: 0; z-index: 99990; pointer-events: none;
      background: repeating-linear-gradient(
        to bottom,
        rgba(255, 255, 255, 0.015) 0 1px,
        transparent 1px 3px
      );
      mix-blend-mode: overlay;
    }

    #map {
      position: fixed; inset: 0 auto 0 0; width: calc(100vw - 380px);
      background: var(--bg-0);
    }
    /* Faint radar grid behind the tiles, and a sweep mask when filters change */
    #map::after {
      content: ""; position: absolute; inset: 0; z-index: 400; pointer-events: none;
      background:
        radial-gradient(circle at 18% 16%, rgba(34, 211, 238, 0.05), transparent 40%),
        repeating-linear-gradient(0deg, rgba(34, 211, 238, 0.02) 0 1px, transparent 1px 64px),
        repeating-linear-gradient(90deg, rgba(34, 211, 238, 0.02) 0 1px, transparent 1px 64px);
    }
    #map.map-sweep .leaflet-overlay-pane { animation: sweepIn .32s ease; }

    /* Radar HUD in the bottom-left map corner */
    #radar {
      position: absolute; left: 14px; bottom: 14px; z-index: 700; pointer-events: none;
      width: 92px; height: 92px; opacity: .55; border-radius: 50%;
      border: 1px solid var(--line);
      box-shadow: 0 0 24px rgba(34, 211, 238, 0.10), inset 0 0 18px rgba(34, 211, 238, 0.08);
      background: rgba(9, 15, 25, 0.6);
    }
    #radar::before, #radar::after {
      content: ""; position: absolute; border-radius: 50%;
    }
    #radar::before {
      inset: 8px; border: 1px solid rgba(34, 211, 238, 0.18);
    }
    #radar::after {
      inset: 22px; border: 1px solid rgba(34, 211, 238, 0.14);
    }
    #radar .sweep {
      position: absolute; inset: 0; border-radius: 50%;
      background: conic-gradient(
        from 0deg,
        rgba(34, 211, 238, 0.38) 0deg,
        rgba(34, 211, 238, 0.05) 50deg,
        transparent 70deg
      );
      animation: spin 4s linear infinite;
    }
    #radar .blip {
      position: absolute; left: 50%; top: 22%; width: 5px; height: 5px; margin-left: -2.5px;
      border-radius: 50%; background: var(--amber); opacity: 0;
      box-shadow: 0 0 6px var(--amber);
      animation: radarBlip 4s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes radarBlip {
      0%, 38% { opacity: 0; }
      42% { opacity: 1; }
      48% { opacity: 0; }
    }
    @keyframes sweepIn {
      from { opacity: 0; transform: translateY(3px) scale(0.995); }
      to { opacity: 1; transform: none; }
    }

    #sidebar {
      position: fixed; top: 0; right: 0; bottom: 0; width: 380px;
      background:
        repeating-linear-gradient(0deg, transparent 0 1px, rgba(34, 211, 238, 0.018) 1px 28px),
        repeating-linear-gradient(90deg, transparent 0 1px, rgba(34, 211, 238, 0.018) 1px 28px),
        linear-gradient(180deg, var(--bg-1), var(--bg-0));
      border-left: 1px solid var(--line);
      box-sizing: border-box;
      display: flex; flex-direction: column;
    }

    #sidebar header {
      padding: 14px 18px 12px; flex: 0 0 auto;
      background: linear-gradient(180deg, rgba(34, 211, 238, 0.10), rgba(34, 211, 238, 0.02));
      border-bottom: 1px solid var(--line-soft);
    }
    #sidebar header h1 {
      font-family: var(--font-display);
      font-size: 17px; letter-spacing: .06em; margin: 0 0 5px;
      text-transform: uppercase;
      color: var(--text-1);
    }
    #sidebar header h1 .accent { color: var(--accent); }
    #sidebar header p { margin: 0; font-size: 11px; line-height: 1.45; color: var(--text-2); }
    .live-row { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
    .live {
      display: inline-flex; align-items: center; gap: 7px;
      font-family: var(--font-mono); font-size: 10px; letter-spacing: .14em;
      color: var(--accent); text-transform: uppercase;
    }
    .live .dot {
      width: 7px; height: 7px; border-radius: 50%; background: var(--accent);
      box-shadow: 0 0 4px var(--accent), 0 0 12px var(--accent);
      animation: livePulse 1.8s ease-in-out infinite;
    }
    @keyframes livePulse {
      0%, 100% { opacity: 1; box-shadow: 0 0 4px var(--accent), 0 0 12px var(--accent); }
      50% { opacity: .45; box-shadow: 0 0 2px var(--accent), 0 0 5px var(--accent); }
    }
    .live-spacer { flex: 1; }

    #controls { padding: 12px 18px 10px; border-bottom: 1px solid var(--line-soft); flex: 0 0 auto; }
    #controls button.primary-btn {
      font-family: var(--font-display); letter-spacing: .05em; text-transform: uppercase;
      background: var(--accent); color: #04121a; border: 0; border-radius: 3px;
      padding: 7px 12px; cursor: pointer; font-size: 12px; font-weight: 600;
      box-shadow: 0 0 14px rgba(34, 211, 238, 0.25);
      transition: transform .12s ease, box-shadow .12s ease;
    }
    #controls button.primary-btn:hover { transform: translateY(-1px); box-shadow: 0 0 20px rgba(34, 211, 238, 0.4); }
    #view-toggle { margin-bottom: 10px; display: flex; gap: 6px; }
    #view-toggle button {
      font-family: var(--font-display); letter-spacing: .04em; text-transform: uppercase;
      flex: 1; background: var(--bg-2); color: var(--text-2); border: 1px solid var(--line);
      border-radius: 3px; padding: 7px 8px; cursor: pointer; font-size: 11px; font-weight: 600;
      transition: all .15s ease;
    }
    #view-toggle button:hover { color: var(--text-1); border-color: var(--accent-dim); }
    #view-toggle button.active { background: var(--bg-3); color: var(--accent); border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }

    #category-filters { margin: 6px 0 10px; display: flex; flex-wrap: wrap; gap: 5px; }
    .filter-tab {
      display: inline-flex; align-items: center; gap: 5px;
      font-family: var(--font-mono); font-size: 10.5px;
      background: var(--bg-2); color: var(--text-2); border: 1px solid var(--line);
      border-radius: 14px; padding: 4px 9px; cursor: pointer;
      transition: all .18s ease;
    }
    .filter-tab:hover { color: var(--text-1); border-color: var(--accent-dim); transform: translateY(-1px); }
    .filter-tab.active {
      color: #04121a; background: var(--accent); border-color: var(--accent);
      box-shadow: 0 0 12px rgba(34, 211, 238, 0.35);
    }
    .filter-tab .badge-count {
      font-family: var(--font-mono); font-weight: 600;
      background: rgba(255, 255, 255, 0.10); border-radius: 8px; padding: 0 5px;
    }
    .filter-tab.active .badge-count { background: rgba(4, 18, 26, 0.18); }
    .btn-reload {
      font-family: var(--font-mono); font-size: 10px; letter-spacing: .06em; text-transform: uppercase;
      background: transparent; color: var(--text-2); border: 1px solid var(--line);
      border-radius: 3px; padding: 5px 10px; cursor: pointer; transition: all .15s ease;
    }
    .btn-reload:hover { color: var(--accent); border-color: var(--accent); }

    #summary {
      margin: 8px 0 4px; font-family: var(--font-mono); font-size: 11.5px;
      color: var(--text-2); line-height: 1.5;
    }
    #summary .big {
      font-family: var(--font-display); font-weight: 700; font-size: 22px;
      color: var(--accent); margin-right: 4px;
    }
    #legend { margin-top: 6px; font-family: var(--font-mono); font-size: 10px; color: var(--text-3); display: flex; flex-wrap: wrap; gap: 7px 12px; }
    #legend .swatch {
      display: inline-block; width: 9px; height: 9px; border-radius: 50%;
      margin-right: 4px; vertical-align: middle;
    }
    #legend .ring {
      display: inline-block; width: 10px; height: 10px;
      border: 2px dashed var(--persist); border-radius: 50%; box-sizing: border-box;
      margin-right: 4px; vertical-align: middle; animation: livePulse 2s ease-in-out infinite;
    }

    #list {
      flex: 1 1 auto; overflow-y: auto; padding: 10px 0 18px;
      scrollbar-width: thin; scrollbar-color: var(--line) transparent;
    }
    #list::-webkit-scrollbar { width: 8px; }
    #list::-webkit-scrollbar-thumb { background: var(--line); border-radius: 4px; }

    .section-title {
      font-family: var(--font-display); letter-spacing: .08em; text-transform: uppercase;
      font-size: 11px; font-weight: 600; color: var(--text-2);
      padding: 14px 18px 6px;
    }
    .section-title .n { font-family: var(--font-mono); color: var(--accent); }

    .entry {
      --card-accent: var(--text-3);
      --card-glow: rgba(132, 148, 171, 0.12);
      margin: 0 14px 9px; padding: 11px 13px 11px 15px;
      background: linear-gradient(180deg, var(--bg-2), var(--bg-1));
      border: 1px solid var(--line-soft);
      border-left: 3px solid var(--card-accent);
      border-radius: 5px;
      cursor: pointer; font-size: 12px;
      transition: transform .14s ease, border-color .14s ease, box-shadow .14s ease;
      box-shadow: 0 1px 0 rgba(0, 0, 0, 0.25);
    }
    .entry:hover {
      transform: translateY(-1px);
      border-color: var(--card-accent);
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.35), 0 0 16px var(--card-glow);
    }
    .entry.entry-persistent   { --card-accent: var(--persist);   --card-glow: rgba(251, 191, 36, 0.16); }
    .entry.entry-flare        { --card-accent: var(--flare);     --card-glow: rgba(249, 115, 22, 0.16); }
    .entry.entry-industrial   { --card-accent: var(--industrial);--card-glow: rgba(96, 165, 250, 0.16); }
    .entry.entry-mining       { --card-accent: var(--mine);      --card-glow: rgba(161, 98, 6, 0.16); }
    .entry.entry-forest       { --card-accent: var(--forest);    --card-glow: rgba(52, 211, 153, 0.16); }
    .entry.entry-other_natural{ --card-accent: var(--amber);     --card-glow: rgba(245, 158, 11, 0.16); }
    .entry .head { display: flex; justify-content: space-between; font-weight: 600; }
    .entry .dist { font-family: var(--font-mono); color: var(--accent); font-size: 11px; }
    .entry dl { margin: 7px 0 0; display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; }
    .entry dt { color: var(--text-3); font-family: var(--font-mono); font-size: 10px; text-transform: uppercase; letter-spacing: .04em; }
    .entry dd { margin: 0; font-family: var(--font-mono); font-size: 11px; color: var(--text-2); }

    .verdict {
      display: flex; align-items: center; gap: 9px;
      font-family: var(--font-display); font-size: 14.5px; font-weight: 600; line-height: 1.15;
    }
    .verdict .badge {
      --badge-accent: var(--text-3); --badge-glow: transparent;
      flex: 0 0 auto; width: 26px; height: 26px; border-radius: 50%;
      display: inline-flex; align-items: center; justify-content: center;
      font-size: 13px;
      background: radial-gradient(circle at 30% 28%, var(--bg-3), var(--bg-1) 70%);
      border: 1px solid var(--badge-accent);
      box-shadow: 0 0 10px var(--badge-glow), inset 0 0 6px rgba(0, 0, 0, 0.4);
    }
    .verdict .badge.badge-persistent    { --badge-accent: var(--persist);     --badge-glow: rgba(251, 191, 36, .35); }
    .verdict .badge.badge-flare         { --badge-accent: var(--flare);       --badge-glow: rgba(249, 115, 22, .35); }
    .verdict .badge.badge-industrial    { --badge-accent: var(--industrial);  --badge-glow: rgba(96, 165, 250, .35); }
    .verdict .badge.badge-mining        { --badge-accent: var(--mine);        --badge-glow: rgba(161, 98, 6, .35); }
    .verdict .badge.badge-forest        { --badge-accent: var(--forest);      --badge-glow: rgba(52, 211, 153, .35); }
    .verdict .badge.badge-other_natural { --badge-accent: var(--amber);       --badge-glow: rgba(245, 158, 11, .35); }

    .detail { margin: 4px 0 0; color: var(--text-1); font-weight: 600; font-size: 12px; }
    .persist { margin: 5px 0 0; color: var(--persist); font-weight: 600; font-size: 11.5px; }
    .reason { margin: 4px 0 0; font-size: 11px; color: var(--text-3); font-style: italic; }
    details { margin-top: 7px; }
    details > summary { cursor: pointer; font-family: var(--font-mono); font-size: 10px; letter-spacing: .06em; text-transform: uppercase; color: var(--accent); }
    details[open] > summary { margin-bottom: 5px; }
    .kv { display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; font-family: var(--font-mono); font-size: 10.5px; color: var(--text-2); }
    .kv b { color: var(--text-3); font-weight: 500; }
    .leaflet-popup .fb { min-width: 230px; }
    .leaflet-popup-content-wrapper {
      background: var(--bg-2); color: var(--text-1); border: 1px solid var(--line);
      border-radius: 6px; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
    }
    .leaflet-popup-tip { background: var(--bg-2); border: 1px solid var(--line); }
    .leaflet-popup-content { font-family: var(--font-body); }
    .leaflet-container a.leaflet-popup-close-button { color: var(--text-2); }

    .empty { padding: 24px 16px; color: var(--text-3); font-size: 12px; font-family: var(--font-mono); text-align: center; }

    /* Sidebar list fade/scale when the filter changes */
    .list-fade .entry { animation: listIn .26s ease backwards; }
    .list-fade .entry:nth-child(2n) { animation-delay: .025s; }
    .list-fade .entry:nth-child(3n) { animation-delay: .05s; }
    @keyframes listIn {
      from { opacity: 0; transform: translateX(8px) scale(0.985); }
      to { opacity: 1; transform: none; }
    }

    /* Persistent thermal markers: marching "actively watched" pulse */
    @keyframes persistPulse {
      0%, 100% { stroke-opacity: .95; }
      50% { stroke-opacity: .38; }
    }
    @keyframes persistAnts { to { stroke-dashoffset: -32; } }
    #map path.marker-persistent {
      animation: persistPulse 2.4s ease-in-out infinite, persistAnts 1.4s linear infinite;
    }

    /* Sidebar-hover highlight on the linked map marker */
    @keyframes markerBounce {
      0%, 100% { transform: none; }
      50% { transform: scale(1.35); }
    }
    #map path.marker-hover {
      animation: markerBounce .45s ease 1;
      stroke-width: 3;
      filter: drop-shadow(0 0 5px var(--accent));
    }

    .leaflet-control-layers {
      background: var(--bg-2) !important; color: var(--text-1) !important;
      border: 1px solid var(--line) !important; border-radius: 4px !important;
      font-family: var(--font-mono); font-size: 11px;
    }
    .leaflet-control-layers label { color: var(--text-1); }
    .leaflet-control-layers-expanded { padding: 8px 10px !important; }
    .leaflet-bar a { background: var(--bg-2); color: var(--text-1); border-bottom: 1px solid var(--line); }
    .leaflet-bar a:hover { background: var(--bg-3); }
  </style>
</head>
<body>
  <div class="scanlines"></div>
  <div id="map">
    <div id="radar"><div class="sweep"></div><div class="blip"></div></div>
  </div>

  <aside id="sidebar">
    <header>
      <h1>SIH26162 <span class="accent">·</span> Industrial Fire Monitor</h1>
      <p>Live NASA FIRMS hotspots &times; OSM industrial / mining zones + WRI power plants · VIIRS Nightfire gas-flare evidence</p>
      <div class="live-row">
        <span class="live"><span class="dot"></span>Live</span>
        <span class="live-spacer"></span>
        <span class="live" id="live-ts">FIRMS feed</span>
      </div>
    </header>
    <div id="controls">
      <div id="view-toggle" role="group" aria-label="Sidebar view">
        <button id="view-detections" class="active">Detections</button>
        <button id="view-sites">Clustered sites</button>
      </div>
      <div id="category-filters" role="group" aria-label="Fire category filter">
        <button class="filter-tab active" data-category="all">All <span class="badge-count" id="count-all">0</span></button>
        <button class="filter-tab" data-category="industrial"><span>🏭</span>Ind <span class="badge-count" id="count-ind">0</span></button>
        <button class="filter-tab" data-category="mining"><span>⛏</span>Mining <span class="badge-count" id="count-mining">0</span></button>
        <button class="filter-tab" data-category="forest"><span>🌲</span>Forest <span class="badge-count" id="count-forest">0</span></button>
        <button class="filter-tab" data-category="other_natural"><span>🌾</span>Agri <span class="badge-count" id="count-nat">0</span></button>
        <button class="filter-tab" data-category="flare"><span>🔥</span>Flare <span class="badge-count" id="count-flare">0</span></button>
        <button class="filter-tab" data-category="persistent"><span>🔴</span>Persistent <span class="badge-count" id="count-persist">0</span></button>
      </div>
      <button id="reload" class="btn-reload">Refresh data</button>
      <div id="summary">Loading…</div>
      <div id="legend">
        <span><span class="swatch" style="background:#e5484d"></span>High</span>
        <span><span class="swatch" style="background:#f59e0b"></span>Nominal</span>
        <span><span class="swatch" style="background:#fde68a"></span>Low</span>
        <span><span class="ring"></span>Persistent</span>
        <span><span class="swatch" style="background:#f97316"></span>Flare</span>
        <span><span class="swatch" style="background:#c084fc"></span>Site</span>
        <span><span class="swatch" style="background:#22d3ee;opacity:.5"></span>Zone</span>
        <span><span class="swatch" style="background:#818cf8"></span>Plant</span>
      </div>
    </div>
    <div id="list"><div class="empty">Loading fire detections…</div></div>
  </aside>

  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""
  ></script>
  <script src="/static/app.js"></script>
</body>
</html>
