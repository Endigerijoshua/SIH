<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SIH26162 — Industrial Fire Detection</title>
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  />
  <style>
    html, body { margin: 0; padding: 0; height: 100%; font-family: "Segoe UI", Arial, sans-serif; }
    #map {
      position: fixed; inset: 0 auto 0 0; width: calc(100vw - 360px);
    }
    #sidebar {
      position: fixed; top: 0; right: 0; bottom: 0; width: 360px;
      background: #f7f8fa; border-left: 1px solid #ddd; box-sizing: border-box;
      display: flex; flex-direction: column;
    }
    #sidebar header {
      padding: 14px 16px; background: #1f2d3d; color: #fff; flex: 0 0 auto;
    }
    #sidebar header h1 { font-size: 15px; margin: 0 0 4px; }
    #sidebar header p { margin: 0; font-size: 12px; opacity: 0.8; }
    #controls {
      padding: 10px 16px; border-bottom: 1px solid #ddd; flex: 0 0 auto;
      background: #fff;
    }
    #controls button {
      background: #1f6feb; color: #fff; border: 0; border-radius: 4px;
      padding: 6px 12px; cursor: pointer; font-size: 12px;
    }
    #controls button:hover { background: #1857b8; }
    #view-toggle { margin-bottom: 8px; display: flex; gap: 6px; }
    #view-toggle button {
      background: #e5e9f0; color: #333; border: 0; border-radius: 4px;
      padding: 6px 12px; cursor: pointer; font-size: 12px;
    }
    #view-toggle button.active { background: #1f2d3d; color: #fff; }
    #summary { margin-top: 8px; font-size: 12px; color: #444; }
    #legend {
      margin-top: 8px; font-size: 11px; color: #555; display: flex; gap: 12px;
    }
    #legend .swatch {
      display: inline-block; width: 10px; height: 10px; border-radius: 50%;
      margin-right: 4px; vertical-align: middle;
    }
    #legend .ring {
      display: inline-block; width: 10px; height: 10px;
      border: 2px dashed #b91c1c; border-radius: 50%; box-sizing: border-box;
      margin-right: 4px; vertical-align: middle;
    }
    #list {
      flex: 1 1 auto; overflow-y: auto; padding: 10px 0;
    }
    .entry {
      margin: 0 12px 8px; padding: 10px 12px; background: #fff;
      border: 1px solid #e2e5ea; border-left: 4px solid #aaa; border-radius: 4px;
      cursor: pointer; font-size: 12px;
    }
    .entry:hover { box-shadow: 0 1px 4px rgba(0,0,0,0.15); }
    .entry .head { display: flex; justify-content: space-between; font-weight: 600; }
    .entry .dist { color: #1f6feb; }
    .entry dl { margin: 6px 0 0; display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; }
    .entry dt { color: #888; font-weight: 600; }
    .entry dd { margin: 0; }
    .empty {
      padding: 20px 16px; color: #666; font-size: 13px; text-align: center;
    }
  </style>
</head>
<body>
  <div id="map"></div>

  <aside id="sidebar">
    <header>
      <h1>SIH26162 · Industrial Fire Monitor</h1>
      <p>Live NASA FIRMS hotspots × OSM industrial zones</p>
    </header>
    <div id="controls">
      <div id="view-toggle" role="group" aria-label="Sidebar view">
        <button id="view-detections" class="active">Detections</button>
        <button id="view-sites">Clustered sites</button>
      </div>
      <button id="reload">Refresh data</button>
      <div id="summary">Loading…</div>
      <div id="legend">
        <span><span class="swatch" style="background:#d7191c"></span>High conf.</span>
        <span><span class="swatch" style="background:#fd8d3c"></span>Nominal conf.</span>
        <span><span class="swatch" style="background:#ffd700"></span>Low conf.</span>
        <span><span class="ring"></span>Persistent source</span>
        <span><span class="swatch" style="background:#7a2ea0"></span>Thermal site</span>
        <span><span class="swatch" style="background:#3388ff;opacity:.45"></span>Industrial zone</span>
      </div>
    </div>
    <div id="list"><div class="empty">Loading fire detections…</div></div>
  </aside>

  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""
  ></script>
  <script src="/static/app.js"></script>
</body>
</html>
